<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email confirmed – Threk</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .box { max-width: 420px; }
    .icon {
      width: 72px; height: 72px; border-radius: 50%;
      background: #1fa855; color: #0a0a0a;
      font-size: 40px; font-weight: bold; line-height: 72px;
      margin: 0 auto 20px;
    }
    .icon.bad { background: #eb5757; color: #ffffff; }
    h1 { font-size: 28px; margin: 0 0 12px; }
    p { color: #d9d9d9; line-height: 1.6; margin: 0 0 12px; }
    .brand { color: #1fa855; font-weight: 600; margin-top: 28px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon" id="icon">✓</div>
    <h1 id="title">Your email is confirmed</h1>
    <p id="text">Go back to the Threk app and log in with your email and password.</p>
    <div class="brand">Threk – Train for your life</div>
  </div>
  <script>
    // Supabase adds error details to the link when it has expired or was already used.
    var info = window.location.hash + window.location.search;
    if (info.indexOf('error') !== -1) {
      document.getElementById('icon').textContent = '!';
      document.getElementById('icon').className = 'icon bad';
      document.getElementById('title').textContent = 'This link did not work';
      document.getElementById('text').textContent =
        'It may have expired or been used already. Try logging in to the Threk app. If that does not work, sign up again to get a new link.';
    }
  </script>
</body>
</html>
